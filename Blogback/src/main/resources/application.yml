server:
  port: 8080

spring:
  application:
    name: BlogBack
  datasource:
    url: jdbc:mysql://localhost:3306/blog?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: your_db_username
    password: your_db_password

mybatis:
  mapper-locations: classpath:Mapper/*.xml
  type-aliases-package: com.zs.blog.pojo
  configuration:
    map-underscore-to-camel-case: true

blog:
  jwt:
    admin-secret-key: replace_with_a_long_random_secret
    admin-ttl: 7200000
    admin-token-name: token
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: your_access_key_id
    access-key-secret: your_access_key_secret
    bucket-name: your_bucket_name
    public-base-url: https://your_bucket_name.oss-cn-beijing.aliyuncs.com
  admin-initializer:
    enabled: false
    id: 1
    username: your_admin_username
    password: your_admin_password
